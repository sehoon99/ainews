spring:
  application:
    name: ainews

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    #url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ainews}?useSSL=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
#    username: ${DB_USERNAME:admin}
#    password: ${DB_PASSWORD:}
    url: jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:mysql}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:6724}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

opensearch:
  host: ${OPENSEARCH_HOST:localhost}
  port: ${OPENSEARCH_PORT:9200}
  scheme: ${OPENSEARCH_SCHEME:http}
  username: ${OPENSEARCH_USERNAME:admin}
  password: ${OPENSEARCH_PASSWORD:admin}
  index-name: articles

---
# Local 환경
spring:
  config:
    activate:
      on-profile: local

  datasource:
    hikari:
      maximum-pool-size: 5

  flyway:
    clean-disabled: false  # 로컬에서만 clean 허용

logging:
  level:
    org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG

---
# Production 환경
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10

  flyway:
    clean-disabled: true  # 운영 DB 보호

opensearch:
  host: ${OPENSEARCH_HOST}
  port: 443
  scheme: https
  use-aws-signing: true
  region: ap-northeast-2

logging:
  level:
    root: INFO
    org.flywaydb: INFO
