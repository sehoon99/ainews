spring:
  application:
    name: ainews

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ainews}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:admin}  # 실제 RDS 생성 시 만든 ID
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

ainews:
  keyword-rank:
    archive-path: ${KEYWORD_RANK_ARCHIVE_PATH:./keyword-rank-archives}
  ses:
    sender-email: ${SES_SENDER_EMAIL:noreply@ainews.example.com}
    region: ap-northeast-2
    base-url: ${APP_BASE_URL:http://localhost:8080}

management:
  server:
    port: 9091
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${SPRING_PROFILES_ACTIVE:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: true

---
# Local 환경
spring:
  config:
    activate:
      on-profile: local

  datasource:
    hikari:
      maximum-pool-size: 5

  flyway:
    clean-disabled: false  # 로컬에서만 clean 허용

logging:
  level:
    org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG

---
# Production 환경
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10

  flyway:
    clean-disabled: true  # 운영 DB 보호

logging:
  level:
    root: INFO
    org.flywaydb: INFO
