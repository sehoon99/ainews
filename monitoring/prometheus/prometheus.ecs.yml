global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: ainews
    environment: prod

scrape_configs:
  - job_name: ainews-backend
    metrics_path: /actuator/prometheus
    scheme: http
    dns_sd_configs:
      - names:
          - backend-metrics.ainews.local
        type: SRV
        refresh_interval: 30s
