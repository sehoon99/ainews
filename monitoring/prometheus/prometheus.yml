global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: ainews

scrape_configs:
  - job_name: ainews-backend
    metrics_path: /actuator/prometheus
    scheme: http
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.json
        refresh_interval: 30s
